import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.teavm.gradle.api.OptimizationLevel
import org.teavm.gradle.api.SourceFilePolicy
import org.teavm.gradle.tasks.GenerateJavaScriptTask

plugins {
    id 'java-library'
    id 'org.teavm' version '0.15.0'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'be.elevenways.protoblast' version '0.1.0-SNAPSHOT'
    id 'be.elevenways.zenit' version '0.1.0-SNAPSHOT'
}

// AIDEV-NOTE: the org.checkerframework Gradle plugin was removed during the Java 25 / Gradle 9
// migration (it dropped checker-qual from custom source sets and ran no checkers anyway); the
// checker-qual annotation artifact is declared directly on every source set below instead.

group = 'be.elevenways'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// --- Source Sets ---
sourceSets {
    common {
        java { srcDirs = ['src/common/java'] }
        resources { srcDirs = ['src/common/resources'] }
    }

    client {
        java {
            srcDirs = ['src/client/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/client/resources'] }
    }

    server {
        java {
            srcDirs = ['src/server/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/server/resources'] }
    }

    browserTest {
        java { srcDirs = ['src/browserTest/java'] }
        resources { srcDirs = ['src/browserTest/resources'] }
        // Server fold: server.output carries the server fold of every common class.
        // build/classes/java/common is the CHIMERA fold (common compiles against
        // protoblast-client, so IS_TEAVM folds to the BROWSER value) -- never stack it.
        compileClasspath += sourceSets.server.output + sourceSets.client.output
        runtimeClasspath += sourceSets.server.output
    }
}

// --- Hawkeye Template Compilation ---
hawkeye {
    namespace = 'hohenheim'
    templateDirs = ['src/common/templates']
    scss {
        // Registers /hohenheim.css at the app weight (registration class is
        // generated by the be.elevenways.zenit plugin).
        register = 'app'
    }
}

// --- Configurations ---
configurations {
    all {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }

    spamserviceDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// --- Compile Tasks ---
tasks.named('compileCommonJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileServerJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileClientJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// --- Dependencies ---
dependencies {
    // Common (compile-only since client/server each pull their own variant)
    commonCompileOnly teavm.libs.jsoApis
    commonCompileOnly ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:plumage-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-forms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-microcopy-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-auth-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-cms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-widget-common:0.1.0-SNAPSHOT') { changing = true }

    // Client (TeaVM-compiled browser code)
    clientCompileOnly sourceSets.common.output
    clientImplementation teavm.libs.jsoApis
    clientImplementation ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:plumage-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-forms-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-microcopy-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-cms-client:0.1.0-SNAPSHOT') { changing = true }
    // The shell user menu (zn-auth-user-menu, contributed by AuthCmsBridge)
    // must hydrate: the client bundle needs zenit-auth's compiled templates
    // (carried by the self-sufficient client platform jar).
    clientImplementation ('be.elevenways:zenit-auth-client:0.1.0-SNAPSHOT') { changing = true }

    // Server
    serverCompileOnly sourceSets.common.output
    serverImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    // Spamservice: the canonical IP-reputation / security-event authority
    // (reputation pulls + client provisioning for managed sites).
    serverImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    spamserviceDistribution ('be.elevenways:spamservice-server:0.1.0-SNAPSHOT') { changing = true }

    commonImplementation 'org.checkerframework:checker-qual:4.2.0'
    clientImplementation 'org.checkerframework:checker-qual:4.2.0'
    serverImplementation 'org.checkerframework:checker-qual:4.2.0'

    // Database
    serverImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // ACME / Let's Encrypt
    serverImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'

    // DNS wire format (authoritative DNS server)
    serverImplementation 'dnsjava:dnsjava:3.6.5'

    // PEM parsing (BouncyCastle)
    serverImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // Browser tests
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer auto-provides the JUnit Platform launcher (propagates to browserTest
    // via extendsFrom). Java 25 needs checker-qual on the test classpaths too (the removed
    // checkerframework plugin used to supply it).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.checkerframework:checker-qual:4.2.0'
    browserTestImplementation platform('org.junit:junit-bom:5.10.0')
    browserTestImplementation 'org.junit.jupiter:junit-jupiter'
    // The live-lane report is a TestExecutionListener, so the launcher API has to be on
    // the COMPILE path here, not merely on the runtime one Gradle supplies.
    browserTestImplementation 'org.junit.platform:junit-platform-launcher'
    browserTestImplementation 'com.microsoft.playwright:playwright:1.48.0'
    browserTestImplementation 'org.assertj:assertj-core:3.25.3'
    browserTestImplementation sourceSets.server.output
    browserTestImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-test-support:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    // The shared source-guard scanner: PageTitleLocalizationTest declares its own rule
    // (a repo-specific mechanism, so not a BuiltInRules entry) and drives the same walk.
    browserTestImplementation ('be.elevenways:protoblast-source-guard:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    browserTestImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    browserTestImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'
    browserTestImplementation 'dnsjava:dnsjava:3.6.5'
}

// The runtime-image build contexts ride the SERVER resources, so a host that has to
// build `hohenheim/node-22:1` at first use can do it from the deployed jar and never
// from a checkout nobody promised is there. The manifest is generated because a
// directory inside a jar cannot be listed.
def runtimeImageManifest = layout.buildDirectory.file('generated/runtime-images/manifest.txt')

tasks.register('runtimeImageManifest') {
    inputs.dir('images')
    outputs.file(runtimeImageManifest)
    doLast {
        def root = file('images').toPath()
        def target = runtimeImageManifest.get().asFile
        target.parentFile.mkdirs()
        target.text = fileTree('images').files
                .collect { root.relativize(it.toPath()).toString() }
                .sort()
                .join('\n') + '\n'
    }
}

tasks.named('processServerResources') {
    dependsOn 'runtimeImageManifest'
    from('images') { into 'hohenheim-images' }
    from(runtimeImageManifest) { into 'hohenheim-images' }
}

// --- JAR Tasks ---
// The whole assembly doctrine (merged services/resources/microcopy/tsv/
// teavm.properties, the TeaVmPatchLane strip, DuplicatesStrategy.FAIL, the
// zero-duplicate and patched-byte checks, inert-metadata exclusion) comes from
// the protoblast plugin's blastServerJar/blastTeavmJar lanes; only hohenheim's
// own content and assertions live here.
def serverJar = blastServerJar(
        mainClass: 'be.elevenways.hohenheim.server.ServerMain',
        // dnsjava's Java 18 InetAddressResolverProvider exists only in META-INF/versions/18.
        multiRelease: true,
        implementationTitle: project.name,
        microcopyKeys: ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'],
        microcopyScopes: ['dyndns_token': 'hohenheim', 'back_to_list': 'zenit-cms'],
)

serverJar.configure {
    from({ project.configurations.spamserviceDistribution.singleFile }) {
        into 'managed-services'
        rename { 'spamservice-server.jar' }
    }

    // App-specific integrity checks (deliberately NOT generalized into the lane).
    doLast {
        def jarFile = archiveFile.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            // The deployable must be self-contained: a jar without the client bundle
            // deploys an old front-end against a new server (the starfleet Aug 10/15
            // version skew). The assembly lane packs these; this pins that it did.
            ['public/cms.js', 'public/cms.js.map', 'public/hohenheim.css'].each { asset ->
                if (jar.getEntry(asset) == null) {
                    throw new GradleException("${jarFile.name} is missing ${asset} -- a jar-only deploy would strand the front-end")
                }
            }
            def resolver = 'META-INF/versions/18/org/xbill/DNS/spi/DnsjavaInetAddressResolverProvider.class'
            if (jar.getEntry(resolver) == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's Java 18 resolver provider")
            }
            if (jar.getEntry('META-INF/services/java.net.spi.InetAddressResolverProvider') == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's resolver service registration")
            }
            def nested = jar.getJarEntry('managed-services/spamservice-server.jar')
            if (nested == null) {
                throw new GradleException("${jarFile.name} is missing the nested Spamservice distribution")
            }
            if (jar.getEntry('be/elevenways/spamservice/server/ServerMain.class') != null) {
                throw new GradleException("${jarFile.name} exploded Spamservice server classes onto Hohenheim's classpath")
            }
            def platformClass = 'be/elevenways/protoblast/common/dry/BlastDrySerializers.class'
            def platformCopies = jar.stream().filter { it.name == platformClass }.count()
            if (platformCopies != 1) {
                throw new GradleException("${jarFile.name} contains ${platformCopies} Protoblast platform copies")
            }
            def hashStream = { input ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
                digest.digest()
            }
            def expected = project.configurations.spamserviceDistribution.singleFile.withInputStream {
                hashStream(it)
            }
            def actual = jar.getInputStream(nested).withCloseable { hashStream(it) }
            if (!java.util.Arrays.equals(expected, actual)) {
                throw new GradleException("${jarFile.name} contains the wrong Spamservice distribution")
            }
        } finally {
            jar.close()
        }
    }
}

// --- TeaVM ---
// The lane also owns the teavmInput configuration (jar + TeaVM runtime libs)
// and the GenerateJavaScriptTask wiring.
blastTeavmJar(
        taskName: 'browserJar',
        description: 'Fat JAR for TeaVM compilation',
        microcopyKeys: ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'],
)

teavm {
    js {
        // AIDEV-NOTE: hohenheim shipped obfuscated=false + optimization=NONE until 2026-08-12
        // and its bundle was 23,986,504 bytes -- SIX TIMES its sibling apps (orcono 4.0MB, QQ
        // 3.9MB, thoth 3.5MB), all of which already carried these two settings and the reasoning
        // below. Every admin page load paid that parse, in production and in every browser test:
        // measured client-side cost per navigation was 311-1166ms against 35-229ms of server
        // render, so the CLIENT was 6-10x the server on every page.
        // Debuggability survives: sourceMap = true still maps stack traces back to Java source.
        // Flip obfuscated to false TEMPORARILY when running protoblast/tools/analyze-teavm-bundle,
        // which needs unmangled names -- and flip it back.
        obfuscated = true
        addedToWebApp = true
        sourceMap = true
        strict = false
        // DO_NOTHING, not LINK_LOCAL_FILES: the map ships in the server jar and is
        // served publicly, and LINK_LOCAL_FILES embeds absolute file:///tmp/... build
        // paths as source links -- browsers refuse them with a security error on every
        // page load and the map leaks local build paths. Mapping stack traces back to
        // Java file+line needs only the mappings, which DO_NOTHING keeps.
        sourceFilePolicy = SourceFilePolicy.DO_NOTHING
        // BALANCED, deliberately, matching orcono/QQ/thoth: NONE ships the unoptimized bundle
        // measured above, and AGGRESSIVE is catastrophic (orcono measured 87.8MB vs 14.9MB at
        // BALANCED -- inlining multiplies the honest suspendable bodies). Do not flip to
        // AGGRESSIVE without re-measuring.
        optimization = OptimizationLevel.BALANCED
        mainClass = "be.elevenways.hohenheim.ClientMain"
        // The shell auto-injects the bundle from Hawkeye.clientScriptLocation;
        // ServerMain points that at /cms.js, so the bundle lands there.
        targetFileName = "cms.js"
    }
}

// The Hawkeye template stage registers copyClientJs (dev serving: TeaVM JS into
// the project public/ dir) and compileHawkeyeScss; the server jar no longer
// depends on either by name -- the assembly lane packs generateJavaScript's
// output and the scss packaging injects the css, each with its own task wiring.

// AIDEV-NOTE: ONE fork count for all three browser lanes. Gradle never runs two tasks of the
// same project concurrently, so the lanes are strictly sequential and this number IS the
// machine's utilisation: at the old min(cpus/2-1, 4) exactly 4 of 10 cores were ever busy.
// The old cap was sized for the forkEvery=1 world, where a full lane meant ~140 JVMs each
// holding a 2g heap; collapsing the lanes took that to 13, so the memory argument for 4 is
// gone. Sized to leave the gradle daemon and the OS four cores.
ext.browserTestForks = Math.min(Math.max(Runtime.runtime.availableProcessors() - 4, 1), 6)

// --- Browser Test Task ---
task browserTest(type: Test) {
    description = 'Run browser tests using Playwright'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // AIDEV-NOTE: THREE buckets, times two lanes. This one holds the @Tag("shared-server")
    // classes (inherited from HohenheimTestBase): they share one booted server and one
    // browser per JVM across parallel forks. browserTestStandalone holds everything that
    // needs no served app, ALSO sharing a JVM. browserTestSolo holds the handful that
    // genuinely cannot share one. See browserTestStandalone for the derivation.
    // Orthogonally, live-capable classes carry @Tag("slow") (SlowLaneGuardTest enforces
    // it): zenit-dev's init script excludes that tag on ordinary runs, so the default
    // lane is the hermetic suite; `zenit-dev test --all` (or any --class filter) runs
    // the live classes too. The 60m timeouts below are sized to the FULL --all runs.
    useJUnitPlatform {
        includeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // Gradle's Test default is 512m; the build lane buffers an image tar through heap
    // (bounded by builds.max_artifact_mb), so a realistic artifact needs real headroom.
    maxHeapSize = '2g'
    // AIDEV-NOTE: a task timeout KILLS workers mid-test and Gradle then reports the
    // killed test as SKIPPED with no message (observed 2026-08-10: the per-class-JVM lane
    // hit 30m, RestoreCapacityLiveTest was killed mid-flight, its finally never ran and
    // daystrom kept a stale root key). Two defenses: LiveLaneReport keeps a truncation
    // marker (build/live-lane-truncations/) naming every unsettled test, and the budget
    // is sized to real runs -- measured full browser-lane invocations complete in ~31m
    // wall for BOTH buckets (runs 117/118, 2026-08-10) and the killed run's leftover
    // work measured ~6.5m more, so a healthy worst case is ~37m; 60m is 1.6x that.
    timeout = java.time.Duration.ofMinutes(60)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')
    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // Where LiveLaneReport keeps its truncation markers; per task so a --continue run of
    // the sibling task cannot wipe this task's evidence. A leftover file after a run IS
    // the list of tests that were killed with no verdict.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTest"
    // Forks of this invocation share one freshly-migrated database template
    // (TestDatabases); wiped up front so a migration change can never leak in.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTest"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTest"
        delete "${buildDir}/test-db-templates/browserTest"
    }

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// Standalone browser-test classes: no served app, no browser -- they exercise the server
// runtime, the ORM and pure logic directly. They SHARE a JVM per fork, like browserTest.
//
// AIDEV-NOTE: this task carried forkEvery = 1 until 2026-08-12 and it was the single
// biggest cost in the whole suite. Measured on the 513s default lane: 137 classes, 1064s
// of suite time of which only 321s was test bodies -- 743s was @BeforeAll paying for 136
// REDUNDANT ServerZenitRuntime boots (ensureBooted is idempotent per JVM, and forkEvery=1
// gave every class its own JVM), plus 525s of JVM fork boot at ~3.8s a class. The sibling
// shared-server lane proved the alternative at 0.86s of fixture per class against this
// lane's 5.1s -- same kind of work, six times cheaper, purely because it shares a JVM.
//
// The old justification ("they re-point the global Database.PATH, which yanks the database
// out from under a live shared server") did not survive reading: NO class in this lane
// starts a served app or touches Playwright. The real coupling was never the HTTP server,
// it was two services that CAPTURE a datasource and keep it forever -- zenit-auth's models
// and session store, and the task service's three handles. TestDatabases.freshDatabase now
// re-points both on every swap, which is what makes sharing safe.
//
// A class that genuinely cannot share a JVM declares @Tag("solo") and lands in
// browserTestSolo, which keeps forkEvery = 1. BrowserTestLaneGuardTest enforces the
// declaration; "it failed when I merged it" is not a reason to tag, the reason must be
// process-global state with no reset.
task browserTestStandalone(type: Test) {
    description = 'Run standalone browser tests (no served app) sharing a JVM per fork'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // 'slow' is excluded STRUCTURALLY here, not just by the init script's iteration
    // filter: live classes drive real daemons and hosts, so even on `--all` they must
    // run in the per-class-JVM lane rather than share one.
    useJUnitPlatform {
        excludeTags 'shared-server', 'solo', 'slow'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // See browserTest: the buffered artifact read outgrows Gradle's 512m default.
    maxHeapSize = '2g'
    // See browserTest for the derivation; the 2026-08-10 kill happened in THIS task.
    timeout = java.time.Duration.ofMinutes(60)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')
    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // See browserTest: per-task truncation markers, wiped only by the task that owns them.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTestStandalone"
    // See browserTest: one migrated template shared across this invocation's forks.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTestStandalone"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTestStandalone"
        delete "${buildDir}/test-db-templates/browserTestStandalone"
    }

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// The residue: classes that genuinely cannot share a JVM, each in its own.
//
// AIDEV-NOTE: membership is DECLARED with @Tag("solo") and the declaration must name
// process-global state that has no reset -- not "it went red when I merged it", which is
// usually a leak worth fixing instead. The live lane rides here too: @Tag("slow") classes
// drive real daemons, hosts and images, so they keep a JVM each even under `--all`.
task browserTestSolo(type: Test) {
    description = 'Run browser tests that cannot share a JVM, one JVM per class'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // On an ordinary run zenit-dev's init script adds excludeTags 'slow', leaving just the
    // handful of solo classes; `--all` widens this task to the whole live suite.
    useJUnitPlatform {
        includeTags 'solo', 'slow'
        excludeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // See browserTest: the buffered artifact read outgrows Gradle's 512m default.
    maxHeapSize = '2g'
    // AIDEV-NOTE: forkEvery = 1 costs this lane a FLAT ~65s, and that is the price of the
    // two tests in it. Measured 2026-08-12, all with the same tree: 1 class 73.0s, 2 classes
    // 75.9s, 3 classes 74.5s -- flat, so it is NOT per class. The same 3 classes with
    // forkEvery removed: 11.4s (and RoleRestrictedBootTest then FAILS, which is the proof
    // its solo tag is real). Ruled out by measurement, do not re-try: fewer solo classes
    // (no effect), maxParallelForks 6 -> 2 (worse, 109s), maxHeapSize 2g -> 768m (no effect),
    // and an @AfterAll stopping the appliance RoleRestrictedBootTest boots (no effect).
    // What is left is Gradle's own worker restart cycle; removing this cost means removing
    // the lane, which means making two boot-the-world tests share a JVM with each other.
    forkEvery = 1
    // See browserTest for the derivation; the 2026-08-10 kill happened in this lane.
    timeout = java.time.Duration.ofMinutes(60)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')
    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // See browserTest: per-task truncation markers, wiped only by the task that owns them.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTestSolo"
    // See browserTest: one migrated template shared across this invocation's forks.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTestSolo"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTestSolo"
        delete "${buildDir}/test-db-templates/browserTestSolo"
    }

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// Surfaces LiveLaneReport's truncation markers in the build output. A task timeout kills
// the worker JVM mid-test; Gradle prints the killed test as SKIPPED and the worker's own
// shutdown banner never reaches the captured log (its pipe is gone by teardown), so this
// finalizer -- which runs on task FAILURE too, that being the point -- reads what the
// worker left on disk and says it where the log is actually read.
task reportTruncatedBrowserTests {
    doLast {
        ['browserTest', 'browserTestStandalone', 'browserTestSolo'].each { lane ->
            def dir = file("${buildDir}/live-lane-truncations/${lane}")
            if (dir.directory) {
                dir.eachFile { marker -> System.err.print(marker.text) }
            }
        }
    }
}
tasks.named('browserTest') { finalizedBy reportTruncatedBrowserTests }
tasks.named('browserTestStandalone') { finalizedBy reportTruncatedBrowserTests }
tasks.named('browserTestSolo') { finalizedBy reportTruncatedBrowserTests }

// --- Task Dependencies ---
afterEvaluate {
    tasks.named('compileServerJava') {
        dependsOn 'compileCommonJava'
    }
    tasks.named('generateJavaScript') {
        dependsOn 'compileClientJava', 'compileCommonJava'
    }
    tasks.named('compileBrowserTestJava') {
        dependsOn 'compileCommonJava', 'compileServerJava', 'compileClientJava'
    }
}

// --- Clean ---
tasks.named('clean') {
    doFirst {
        delete(layout.buildDirectory.dir('generated-sources/hawkeye'))
        delete(layout.buildDirectory.dir('generated/teavm'))
        delete('public/cms.js')
        delete('public/hohenheim.css')
    }
}
