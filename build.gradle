plugins {
    // First: the TeaVM plugin reads the source sets the Java plugin it applies creates.
    id 'be.elevenways.protoblast'
    alias(libs.plugins.teavm)
    alias(libs.plugins.shadow)
    alias(libs.plugins.zenit)
}

// AIDEV-NOTE: no 'application' plugin on purpose: the deployable is the fat serverJar, which nests the
// Spamservice distribution and grants native access in its manifest, so zenit-dev starts that jar.
blastApp {
    mainClass 'be.elevenways.hohenheim.server.ServerMain'
    // The shell auto-injects the bundle from Hawkeye.clientScriptLocation; the host wiring points that at
    // /cms.js, so the bundle lands there.
    bundle 'cms.js', mainClass: 'be.elevenways.hohenheim.ClientMain',
            microcopyKeys: ['command_placeholder': 'hohenheim', 'back_to_list': 'zenit-cms']
    serverJar(
            // dnsjava's Java 18 InetAddressResolverProvider exists only in META-INF/versions/18.
            multiRelease: true,
            microcopyKeys: ['command_placeholder': 'hohenheim', 'back_to_list': 'zenit-cms'],
            microcopyScopes: ['dyndns_token': 'hohenheim', 'back_to_list': 'zenit-cms'],
    )
    // The shell user menu (za-user-menu, contributed by AuthCmsBridge) and the admin inbox page's
    // <znt-inbox> hydrate, so zenit-auth and zenit-notifications ride the client bundle too; a VM's screen is
    // zenit-kvm's kvm-screen.
    implementation libs.zenit, libs.hawkeye, libs.plumage, libs.zenit.forms, libs.zenit.microcopy, libs.zenit.auth,
            libs.zenit.cms, libs.zenit.notifications, libs.zenit.media, libs.zenit.kvm
}

blastGuards {
    nonAuthored 'data', 'Runtime state (live git repositories, checkouts, volumes) the controller writes;' +
            ' machine-produced, and its broken symlinks would abort a walk.'

    // Hohenheim's own doctrines, which gate every compile (protoblast-core skill, "Source guards").

    // Soft delete is SoftDeleteBehaviour's: its find hook scopes every find, count and updateAll, so a spelled
    // filter is dead weight at best, and it is how the hand-rolled era produced the reads that FORGOT it. A read that
    // must see a trashed row says so (withTrashed(), onlyTrashed(), StoredRows); a relation hop into one of these
    // models (where no find hook runs) spells the behaviour's own SOFT_DELETE.isNotTrashed(), which this allows; a
    // trash is the model's delete. A pattern sees only its literal shapes, so a pass is not proof.
    rule('hand-rolled-soft-delete') {
        consequence 'Hand-rolled soft delete: use the behaviour (withTrashed/onlyTrashed, StoredRows, the model\'s' +
                ' delete, SOFT_DELETE.isNotTrashed() in a relation hop), never a spelled deleted_at filter or stamp.'
        roots 'src/server/java', 'src/common/java'
        extensions 'java'
        commentMode 'STRIP_LINE_COMMENTS'
        pattern 'spelled trash filter',
                /(?:\b(?:SiteModel|InstanceModel|PreviewDeploymentModel)\.)?\bDELETED_AT\.is(?:Not)?Null\(\)/
        pattern 'hand stamp', /\.set\(\s*(?:SiteModel|InstanceModel|PreviewDeploymentModel)\.DELETED_AT\b/
    }

    // TypeDefinition.getDisplayName() is an English literal by contract: two refusals once embedded one in a
    // localized violation, so a Dutch reader got "Site container" inside a Dutch sentence. The rule bans the CALL,
    // because a display name is equally wrong in a page title, a toast or a flash. DisplayNameLocalizationTest keeps
    // the half a pattern cannot see: every label resolves in en and nl.
    rule('display-name-calls') {
        consequence 'getDisplayName() is an English literal: reading it into anything a user sees renders' +
                ' half-translated copy. Use getLabel(), which is a Microcopy and resolves in the reader\'s locale even' +
                ' as a message argument.'
        roots 'src/server/java', 'src/common/java'
        extensions 'java'
        commentMode 'STRIP_BLOCK_AWARE'
        pattern 'display-name call', /\.getDisplayName\(\)/
    }

    // Every page and error is localized: no page builds its title by concatenating an English literal (eleven call
    // sites had, by the time a sweep was inventoried). A title starts with CmsSupport.pageTitle(, Microcopy.of( or a
    // HohenheimMicrocopy scope, or carries no literal at all (a bare record name is user data, never translated).
    // PageTitleLocalizationTest keeps the half a pattern cannot see: every scope resolves in en and nl.
    rule('page-title-literals') {
        consequence 'A page title mixing an English literal into a record name is unlocalizable: resolve it through' +
                ' CmsSupport.pageTitle (microcopy key page_title in the page\'s own scope, en AND nl).'
        roots 'src/server/java/be/elevenways/hohenheim/server/cms'
        extensions 'java'
        commentMode 'NONE'
        pattern 'page-title',
                /vars\.put\("title",\s*+(?!CmsSupport\.pageTitle\(|Microcopy\.of\(|HohenheimMicrocopy\.).*"/
    }
    rule('proxy-error-title-literals') {
        consequence 'A proxy error page title spelled as an English literal: ErrorPages is the one public-facing' +
                ' error surface, so its titles resolve through microcopy, en AND nl.'
        roots 'src/server/java/be/elevenways/hohenheim/server/proxy/ErrorPages.java'
        extensions 'java'
        commentMode 'NONE'
        pattern 'proxy-error-title', /render\(\w+,\s*"\d{3}",\s*"/
    }

    // A quota dimension is declared in ChargedModel and booked through its lifecycle, which unwinds a refused write;
    // a class reserving or releasing ledger buckets on its own is a dimension implemented BESIDE the mechanism.
    // QuotaDimensionDriftTest keeps the declared dimensions' runtime half.
    rule('quota-ledger-writers') {
        consequence 'A ledger bucket moved outside the quota mechanism. Declare the dimension in ChargedModel; a' +
                ' deliberate explicit move is an exclusion with its reason.'
        roots 'src/server/java', 'src/common/java'
        extensions 'java'
        commentMode 'STRIP_BLOCK_AWARE'
        pattern 'ledger write', /Quotas\.(?:reserve|release)\(/
        exclude 'src/server/java/be/elevenways/hohenheim/server/quota/ChargedModel.java',
                'THE lifecycle every declared dimension is booked through.'
        exclude 'src/server/java/be/elevenways/hohenheim/server/quota/OwnerQuota.java',
                "The owner budgets' guarded reserve."
        exclude 'src/server/java/be/elevenways/hohenheim/server/quota/QuotaReconciler.java',
                'The drift correction.'
        exclude 'src/server/java/be/elevenways/hohenheim/server/instance/InstanceCapacity.java',
                "The host budget's reserve and the explicit migration-window moves."
        exclude 'src/server/java/be/elevenways/hohenheim/server/instance/InstanceQuota.java',
                'moveOwnerCharges, the uncapped heal when ownership moves.'
    }

    // A stack service's live state is ServiceState: its token, its badge and whether it counts as serving are facts
    // on the member. The states were once strings switched on in the runtime, the aggregate and the services page,
    // and the page painted an unknown one neutral. ServiceStateLabelsTest keeps the copy half.
    rule('service-state-literals') {
        consequence 'A stack service state spelled as a string. Read ServiceState: its token(), variant() and' +
                ' good() are the one spelling; Docker\'s own health words are the runtime driver\'s, outside these roots.'
        roots 'src/server/java/be/elevenways/hohenheim/server/stack', 'src/server/java/be/elevenways/hohenheim/server/cms'
        extensions 'java'
        commentMode 'STRIP_BLOCK_AWARE'
        pattern 'state case', /case\s+"(?:healthy|unhealthy|running|starting|stopped|missing|unreachable|orphaned)"/
        pattern 'state comparison',
                /"(?:healthy|unhealthy|running|starting|stopped|missing|unreachable|orphaned)"\.equals\(/
    }

    // What an LSTAT saw is zenit core's FilesystemNodeKind, shared with zenit-forms' browser and zenit-sftp's mounts.
    // The instance-files seam once declared its own copy, mapped onto the SFTP module's by a switch.
    rule('filesystem-node-kinds') {
        consequence 'A filesystem entry kind re-declared. Read zenit core\'s FilesystemNodeKind (FILE, DIRECTORY,' +
                ' SYMLINK, OTHER); a tar header\'s entry kinds (hard links among them) are the archive\'s own.'
        roots 'src/server/java', 'src/common/java'
        extensions 'java'
        commentMode 'STRIP_BLOCK_AWARE'
        pattern 'node kind members', /\{\s*FILE\s*,\s*DIRECTORY\s*,\s*SYMLINK\b/
        exclude 'src/server/java/be/elevenways/hohenheim/server/util/Tar.java',
                'A tar header\'s entry types, which name hard links: the archive format\'s vocabulary, not an lstat.'
    }
}

hawkeye {
    elementPrefix = 'hh'
    scss {
        // Registers /hohenheim.css at the app weight (registration class is
        // generated by the be.elevenways.zenit plugin).
        register = 'app'
    }
}

configurations {
    spamserviceDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    commonCompileOnly libs.hawkeye.client
    commonCompileOnly libs.zenit.widget.common

    // Spamservice: the canonical IP-reputation / security-event authority
    // (reputation pulls + client provisioning for managed sites).
    serverImplementation libs.spamservice.client
    spamserviceDistribution libs.spamservice.server

    // Database
    serverImplementation libs.jdbc.sqlite

    // ACME / Let's Encrypt
    serverImplementation libs.acme4j.client

    // DNS wire format (authoritative DNS server)
    serverImplementation libs.dnsjava

    // PEM parsing (BouncyCastle)
    serverImplementation libs.bouncycastle.pkix

    // A VM's screen: the SPICE client its zenit-kvm screen source reads.
    serverImplementation libs.pepperglass

    // SFTP to app files: zenit-sftp's server over this host's InstanceSftpRealm.
    serverImplementation libs.zenit.sftp.server

    // The live-lane report is a TestExecutionListener, so the launcher API has to be on
    // the COMPILE path here, not merely on the runtime one Gradle supplies.
    browserTestImplementation libs.junit.launcher
    // The shared source-guard scanner: PageTitleLocalizationTest declares its own rule
    // (a repo-specific mechanism, so not a BuiltInRules entry) and drives the same walk.
    browserTestImplementation libs.protoblast.source.guard
    // OutboundFixture: routes a tenant upstream's public-looking name to a loopback stub.
    browserTestImplementation libs.zenit.test.support
    browserTestImplementation libs.zenit.browser.test.support
    browserTestImplementation libs.zenit.auth.test.support
    // The screen journey: a scripted SPICE server behind a VM's screen, read through recording sockets.
    browserTestImplementation(testFixtures(libs.pepperglass))
    browserTestImplementation libs.zenit.kvm.test.support
    // SftpJourneyTest signs in with MINA's own SFTP client, the client zenit-sftp's journeys use.
    browserTestImplementation libs.sshd.core
    browserTestImplementation libs.sshd.sftp
    // PanelSurfaces: the stored before/after and twin captures of the /manage entries.
    browserTestImplementation libs.zenit.cms.test.support
    // FakeTransport: notification-channel tests resolve fake:// DSNs, which production never registers.
    browserTestImplementation libs.zenit.notifications.test.support
    // The permission editor's capture projection, read by the surface captures through its service file.
    browserTestImplementation libs.zenit.auth.test.support
}

// The runtime-image build contexts ride the SERVER resources, so a host that has to
// build `hohenheim/node-22:1` at first use can do it from the deployed jar and never
// from a checkout nobody promised is there. The manifest is generated because a
// directory inside a jar cannot be listed.
def runtimeImageManifest = layout.buildDirectory.file('generated/runtime-images/manifest.txt')

tasks.register('runtimeImageManifest') {
    inputs.dir('images')
    outputs.file(runtimeImageManifest)
    doLast {
        def root = file('images').toPath()
        def target = runtimeImageManifest.get().asFile
        target.parentFile.mkdirs()
        target.text = fileTree('images').files
                .collect { root.relativize(it.toPath()).toString() }
                .sort()
                .join('\n') + '\n'
    }
}

tasks.named('processServerResources') {
    dependsOn 'runtimeImageManifest'
    from('images') { into 'hohenheim-images' }
    from(runtimeImageManifest) { into 'hohenheim-images' }
}

// --- JAR Tasks ---
// The assembly doctrine comes from the protoblast plugin's fat-jar lane; only hohenheim's own
// content and assertions live here.
tasks.named('serverJar') {
    // sqlite-jdbc loads its native library through System.load; JDK 24+ prints a
    // four-line "restricted method" warning for that on EVERY offline command
    // (--rehearse-migrations, --run-migrations, --build-info) unless native access is
    // granted, and the executable-jar manifest is the one place that grants it for a
    // plain `java -jar` with no flags to remember on the boxes.
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }

    // Captured at configuration time: Task.project read while the task runs is refused from Gradle 10.
    def spamserviceDistribution = project.configurations.spamserviceDistribution
    def serverClassDirs = project.sourceSets.server.output.classesDirs
    from({ spamserviceDistribution.singleFile }) {
        into 'managed-services'
        rename { 'spamservice-server.jar' }
    }

    // App-specific integrity checks (deliberately NOT generalized into the lane).
    doLast {
        def jarFile = archiveFile.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            // The deployable must be self-contained: a jar without the client bundle
            // deploys an old front-end against a new server (the starfleet Aug 10/15
            // version skew). The assembly lane packs these; this pins that it did.
            ['public/cms.js', 'public/cms.js.map', 'public/hohenheim.css'].each { asset ->
                if (jar.getEntry(asset) == null) {
                    throw new GradleException("${jarFile.name} is missing ${asset} -- a jar-only deploy would strand the front-end")
                }
            }
            def nativeAccess = jar.manifest?.mainAttributes?.getValue('Enable-Native-Access')
            if (nativeAccess != 'ALL-UNNAMED') {
                throw new GradleException("${jarFile.name} manifest lacks Enable-Native-Access: ALL-UNNAMED -- every offline command would print the JDK native-access warning again")
            }
            def resolver = 'META-INF/versions/18/org/xbill/DNS/spi/DnsjavaInetAddressResolverProvider.class'
            if (jar.getEntry(resolver) == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's Java 18 resolver provider")
            }
            if (jar.getEntry('META-INF/services/java.net.spi.InetAddressResolverProvider') == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's resolver service registration")
            }
            def nested = jar.getJarEntry('managed-services/spamservice-server.jar')
            if (nested == null) {
                throw new GradleException("${jarFile.name} is missing the nested Spamservice distribution")
            }
            // The nested distribution declares the database environment Hohenheim launches it with, judged by the
            // SAME method the launch asks (SpamserviceDatabaseEnvironment.of, loaded from the compiled server
            // classes), so a Hohenheim built from this code can never carry a Spamservice from before the contract.
            def loader = new URLClassLoader(serverClassDirs.files.collect { it.toURI().toURL() } as URL[],
                ClassLoader.platformClassLoader)
            try {
                def environments = loader.loadClass('be.elevenways.hohenheim.server.spamservice.SpamserviceDatabaseEnvironment')
                def of = environments.getDeclaredMethod('of', java.nio.file.Path)
                of.accessible = true
                try {
                    of.invoke(null, spamserviceDistribution.singleFile.toPath())
                } catch (java.lang.reflect.InvocationTargetException refused) {
                    throw new GradleException("${jarFile.name} nests a Spamservice Hohenheim cannot launch: "
                        + refused.cause.message, refused.cause)
                }
            } finally {
                loader.close()
            }
            if (jar.getEntry('be/elevenways/spamservice/server/ServerMain.class') != null) {
                throw new GradleException("${jarFile.name} exploded Spamservice server classes onto Hohenheim's classpath")
            }
            def platformClass = 'be/elevenways/protoblast/common/dry/BlastDrySerializers.class'
            def platformCopies = jar.stream().filter { it.name == platformClass }.count()
            if (platformCopies != 1) {
                throw new GradleException("${jarFile.name} contains ${platformCopies} Protoblast platform copies")
            }
            def hashStream = { input ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
                digest.digest()
            }
            def expected = spamserviceDistribution.singleFile.withInputStream {
                hashStream(it)
            }
            def actual = jar.getInputStream(nested).withCloseable { hashStream(it) }
            if (!java.util.Arrays.equals(expected, actual)) {
                throw new GradleException("${jarFile.name} contains the wrong Spamservice distribution")
            }
        } finally {
            jar.close()
        }
    }
}

// The Hawkeye template stage registers copyClientJs (dev serving: TeaVM JS into
// the project public/ dir) and compileHawkeyeScss; the server jar no longer
// depends on either by name -- the assembly lane packs generateJavaScript's
// output and the scss packaging injects the css, each with its own task wiring.

// AIDEV-NOTE: ONE fork count for all three browser lanes. Gradle never runs two tasks of the
// same project concurrently, so the lanes are strictly sequential and this number IS the
// machine's utilisation: at the old min(cpus/2-1, 4) exactly 4 of 10 cores were ever busy.
// It is an UPPER bound on processors alone. Memory is zenit-dev's fork plan (its init script,
// zenit/tools/lib/memory.js): a fork here costs its 2g heap plus zenit-dev's declared ~0.4 GB
// of JVM overhead and ~0.75 GB of browser, so 6 forks want ~19 GB, more than a 15 GB machine
// has; the plan lowers each lane to what the memory free at the spawn holds (2 forks at
// ~8.8 GB free), or refuses the lane up front naming the shortfall, and the verdict data says
// which. Never raise this past what the plan can hold to "go faster": those forks never start.
ext.browserTestForks = Math.min(Math.max(Runtime.runtime.availableProcessors() - 4, 1), 6)

// --- Browser Test Task ---
// The blastApp lane registers browserTest over the browserTest set; this narrows it to one bucket.
tasks.named('browserTest') {
    // AIDEV-NOTE: THREE buckets, times two lanes. This one holds the @Tag("shared-server")
    // classes (inherited from HohenheimTestBase): they share one booted server and one
    // browser per JVM across parallel forks. browserTestStandalone holds everything that
    // needs no served app, ALSO sharing a JVM. browserTestSolo holds the handful that
    // genuinely cannot share one. See browserTestStandalone for the derivation.
    // Orthogonally, live-capable classes carry @Tag("slow") (SlowLaneGuardTest enforces
    // it): zenit-dev's init script excludes that tag on ordinary runs, so the default
    // lane is the hermetic suite; `zenit-dev test --all` (or any --class filter) runs
    // the live classes too. The 60m timeouts below are sized to the FULL --all runs.
    useJUnitPlatform {
        includeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // AIDEV-NOTE: 1g, measured (2026-10-18, class-level runs at 2g vs 1g on the same classes): this lane peaked at
    // 931 MB used / 1248 committed under -Xmx2g and at 532 used / 646 committed under -Xmx1g, total GC time 1.34s vs
    // 1.41s, no OOM. The heap is what zenit-dev's fork plan charges per fork, so an unused gigabyte costs a fork.
    // The build lane buffers an image tar through heap (bounded by builds.max_artifact_mb), but the classes that
    // build real images are live classes of browserTestSolo, which keeps 2g; no shared-server class builds one.
    maxHeapSize = '1g'
    // AIDEV-NOTE: a task timeout KILLS workers mid-test and Gradle then reports the
    // killed test as SKIPPED with no message (observed 2026-08-10: the per-class-JVM lane
    // hit 30m, RestoreCapacityLiveTest was killed mid-flight, its finally never ran and
    // daystrom kept a stale root key). zenit-dev reports such a test COULD_NOT_RUN by name
    // (a SKIPPED row JUnit itself never skipped; testresults.settleUnexplainedSkips), so the
    // lane is never green. Two defenses here too: LiveLaneReport keeps a truncation
    // marker (build/live-lane-truncations/) naming every unsettled test, and the budget
    // is sized to real runs -- measured full browser-lane invocations complete in ~31m
    // wall for BOTH buckets (runs 117/118, 2026-08-10) and the killed run's leftover
    // work measured ~6.5m more, so a healthy worst case is ~37m; 60m is 1.6x that.
    timeout = java.time.Duration.ofMinutes(60)

    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // Where LiveLaneReport keeps its truncation markers; per task so a --continue run of
    // the sibling task cannot wipe this task's evidence. A leftover file after a run IS
    // the list of tests that were killed with no verdict.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTest"
    // Forks of this invocation share one freshly-migrated database template
    // (TestDatabases); wiped up front so a migration change can never leak in.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTest"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTest"
        delete "${buildDir}/test-db-templates/browserTest"
    }
}

// Standalone browser-test classes: no served app, no browser -- they exercise the server
// runtime, the ORM and pure logic directly. They SHARE a JVM per fork, like browserTest.
//
// AIDEV-NOTE: this task carried forkEvery = 1 until 2026-08-12 and it was the single
// biggest cost in the whole suite. Measured on the 513s default lane: 137 classes, 1064s
// of suite time of which only 321s was test bodies -- 743s was @BeforeAll paying for 136
// REDUNDANT ServerZenitRuntime boots (ensureBooted is idempotent per JVM, and forkEvery=1
// gave every class its own JVM), plus 525s of JVM fork boot at ~3.8s a class. The sibling
// shared-server lane proved the alternative at 0.86s of fixture per class against this
// lane's 5.1s -- same kind of work, six times cheaper, purely because it shares a JVM.
//
// The old justification ("they re-point the global Database.PATH, which yanks the database
// out from under a live shared server") did not survive reading: NO class in this lane
// starts a served app or touches Playwright. The real coupling was never the HTTP server,
// it was two services that CAPTURE a datasource and keep it forever -- zenit-auth's models
// and session store, and the task service's three handles. TestDatabases.freshDatabase now
// re-points both on every swap, which is what makes sharing safe.
//
// A class that genuinely cannot share a JVM declares @Tag("solo") and lands in
// browserTestSolo, which keeps forkEvery = 1. BrowserTestLaneGuardTest enforces the
// declaration; "it failed when I merged it" is not a reason to tag, the reason must be
// process-global state with no reset.
task browserTestStandalone(type: Test) {
    description = 'Run standalone browser tests (no served app) sharing a JVM per fork'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // 'slow' is excluded STRUCTURALLY here, not just by the init script's iteration
    // filter: live classes drive real daemons and hosts, so even on `--all` they must
    // run in the per-class-JVM lane rather than share one.
    useJUnitPlatform {
        excludeTags 'shared-server', 'solo', 'slow'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // See browserTest: 1g, measured (peak 597 MB used under 2g, 552 under 1g; GC 0.65s vs 0.48s). Live classes,
    // which build real images, never run here ('slow' is excluded structurally).
    maxHeapSize = '1g'
    // See browserTest for the derivation; the 2026-08-10 kill happened in THIS task.
    timeout = java.time.Duration.ofMinutes(60)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')
    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // See browserTest: per-task truncation markers, wiped only by the task that owns them.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTestStandalone"
    // See browserTest: one migrated template shared across this invocation's forks.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTestStandalone"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTestStandalone"
        delete "${buildDir}/test-db-templates/browserTestStandalone"
    }

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// The residue: classes that genuinely cannot share a JVM, each in its own.
//
// AIDEV-NOTE: membership is DECLARED with @Tag("solo") and the declaration must name
// process-global state that has no reset -- not "it went red when I merged it", which is
// usually a leak worth fixing instead. The live lane rides here too: @Tag("slow") classes
// drive real daemons, hosts and images, so they keep a JVM each even under `--all`.
task browserTestSolo(type: Test) {
    description = 'Run browser tests that cannot share a JVM, one JVM per class'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // On an ordinary run zenit-dev's init script adds excludeTags 'slow', leaving just the
    // handful of solo classes; `--all` widens this task to the whole live suite.
    useJUnitPlatform {
        includeTags 'solo', 'slow'
        excludeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = browserTestForks
    // 2g, unlike the other two lanes: `--all` runs the live build classes here, and their image tar is read through
    // heap up to builds.max_artifact_mb (1024 MiB by default), past Gradle's 512m default and past 1g.
    maxHeapSize = '2g'
    // AIDEV-NOTE: a worker per class. The lane's old "flat ~65s" (measured 2026-08-12 and
    // blamed on Gradle's worker restart cycle) was a worker per class FILE of the whole source
    // set; the protoblast settings plugin (TaggedForkNarrowing) now hands this lane only the
    // classes its include tags can select.
    forkEvery = 1
    // See browserTest for the derivation; the 2026-08-10 kill happened in this lane.
    timeout = java.time.Duration.ofMinutes(60)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')
    // The live lane's host policy. Unset means "report every skip, fail on none"; a host
    // that declares what it can satisfy (e.g. -Dhohenheim.live.require=docker-socket,netns)
    // turns a skip for those needs into a FAILURE. See test/live/LiveLane.
    systemProperty 'hohenheim.live.require', System.getProperty('hohenheim.live.require', '')
    systemProperty 'hohenheim.live.pull', System.getProperty('hohenheim.live.pull', 'true')
    // See browserTest: per-task truncation markers, wiped only by the task that owns them.
    systemProperty 'hohenheim.truncation.dir',
        "${buildDir}/live-lane-truncations/browserTestSolo"
    // See browserTest: one migrated template shared across this invocation's forks.
    systemProperty 'hohenheim.testdb.template.dir',
        "${buildDir}/test-db-templates/browserTestSolo"
    // Namespace ledgers for the Docker network reaper (test/live/LiveNamespaces). SHARED
    // by all three lanes and deliberately NOT wiped in doFirst: its job is to survive the
    // invocation that wrote it, so a killed worker's leaked networks are reaped next run.
    systemProperty 'hohenheim.namespace.dir', "${buildDir}/live-lane-namespaces"
    doFirst {
        delete "${buildDir}/live-lane-truncations/browserTestSolo"
        delete "${buildDir}/test-db-templates/browserTestSolo"
    }

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// Surfaces LiveLaneReport's truncation markers in the build output. A task timeout kills
// the worker JVM mid-test; Gradle prints the killed test as SKIPPED and the worker's own
// shutdown banner never reaches the captured log (its pipe is gone by teardown), so this
// finalizer -- which runs on task FAILURE too, that being the point -- reads what the
// worker left on disk and says it where the log is actually read.
task reportTruncatedBrowserTests {
    doLast {
        ['browserTest', 'browserTestStandalone', 'browserTestSolo'].each { lane ->
            def dir = file("${buildDir}/live-lane-truncations/${lane}")
            if (dir.directory) {
                dir.eachFile { marker -> System.err.print(marker.text) }
            }
        }
    }
}
tasks.named('browserTest') { finalizedBy reportTruncatedBrowserTests }
tasks.named('browserTestStandalone') { finalizedBy reportTruncatedBrowserTests }
tasks.named('browserTestSolo') { finalizedBy reportTruncatedBrowserTests }

// --- Clean ---
tasks.named('clean') {
    doFirst {
        delete(layout.buildDirectory.dir('generated-sources/hawkeye'))
        delete(layout.buildDirectory.dir('generated/teavm'))
        delete('public/cms.js')
        delete('public/hohenheim.css')
    }
}
