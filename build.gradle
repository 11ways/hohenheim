import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.teavm.gradle.api.OptimizationLevel
import org.teavm.gradle.api.SourceFilePolicy
import org.teavm.gradle.tasks.GenerateJavaScriptTask

plugins {
    id 'java-library'
    id 'org.teavm' version '0.15.0'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'be.elevenways.protoblast' version '0.1.0-SNAPSHOT'
    id 'be.elevenways.zenit' version '0.1.0-SNAPSHOT'
}

// AIDEV-NOTE: the org.checkerframework Gradle plugin was removed during the Java 25 / Gradle 9
// migration (it dropped checker-qual from custom source sets and ran no checkers anyway); the
// checker-qual annotation artifact is declared directly on every source set below instead.

group = 'be.elevenways'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// --- Source Sets ---
sourceSets {
    common {
        java { srcDirs = ['src/common/java'] }
        resources { srcDirs = ['src/common/resources'] }
    }

    client {
        java {
            srcDirs = ['src/client/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/client/resources'] }
    }

    server {
        java {
            srcDirs = ['src/server/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/server/resources'] }
    }

    browserTest {
        java { srcDirs = ['src/browserTest/java'] }
        resources { srcDirs = ['src/browserTest/resources'] }
        compileClasspath += sourceSets.common.output + sourceSets.client.output + sourceSets.server.output
        runtimeClasspath += sourceSets.server.output
    }
}

// --- Hawkeye Template Compilation ---
hawkeye {
    namespace = 'hohenheim'
    templateDirs = ['src/common/templates']
    scss {
        // Registers /hohenheim.css at the app weight (registration class is
        // generated by the be.elevenways.zenit plugin).
        register = 'app'
    }
}

// --- Configurations ---
configurations {
    all {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }

    teavmLibs {
        canBeConsumed = false
        canBeResolved = true
    }

    spamserviceDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// --- Compile Tasks ---
tasks.named('compileCommonJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileServerJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileClientJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// --- Dependencies ---
dependencies {
    // Common (compile-only since client/server each pull their own variant)
    commonCompileOnly teavm.libs.jsoApis
    commonCompileOnly ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:plumage-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-forms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-microcopy-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-auth-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-cms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-widget-common:0.1.0-SNAPSHOT') { changing = true }

    // Client (TeaVM-compiled browser code)
    clientCompileOnly sourceSets.common.output
    clientImplementation teavm.libs.jsoApis
    clientImplementation ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:plumage-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-forms-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-microcopy-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-cms-client:0.1.0-SNAPSHOT') { changing = true }
    // The shell user menu (zn-auth-user-menu, contributed by AuthCmsBridge)
    // must hydrate: the client bundle needs zenit-auth's compiled templates
    // (carried by the self-sufficient client platform jar).
    clientImplementation ('be.elevenways:zenit-auth-client:0.1.0-SNAPSHOT') { changing = true }

    // Server
    serverCompileOnly sourceSets.common.output
    serverImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    // Spamservice: the canonical IP-reputation / security-event authority
    // (reputation pulls + client provisioning for managed sites).
    serverImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    spamserviceDistribution ('be.elevenways:spamservice-server:0.1.0-SNAPSHOT') { changing = true }

    commonImplementation 'org.checkerframework:checker-qual:4.2.0'
    clientImplementation 'org.checkerframework:checker-qual:4.2.0'
    serverImplementation 'org.checkerframework:checker-qual:4.2.0'

    // Database
    serverImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // ACME / Let's Encrypt
    serverImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'

    // DNS wire format (authoritative DNS server)
    serverImplementation 'dnsjava:dnsjava:3.6.5'

    // PEM parsing (BouncyCastle)
    serverImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // Browser tests
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer auto-provides the JUnit Platform launcher (propagates to browserTest
    // via extendsFrom). Java 25 needs checker-qual on the test classpaths too (the removed
    // checkerframework plugin used to supply it).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.checkerframework:checker-qual:4.2.0'
    browserTestImplementation platform('org.junit:junit-bom:5.10.0')
    browserTestImplementation 'org.junit.jupiter:junit-jupiter'
    browserTestImplementation 'com.microsoft.playwright:playwright:1.48.0'
    browserTestImplementation 'org.assertj:assertj-core:3.25.3'
    browserTestImplementation sourceSets.server.output
    browserTestImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-test-support:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    browserTestImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    browserTestImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'
    browserTestImplementation 'dnsjava:dnsjava:3.6.5'

    // TeaVM libraries
    teavmLibs 'org.teavm:teavm-classlib:0.15.0'
    teavmLibs 'org.teavm:teavm-jso-apis:0.15.0'
    teavmLibs 'org.teavm:teavm-jso-impl:0.15.0'
    teavmLibs 'org.teavm:teavm-platform:0.15.0'
    teavmLibs 'org.teavm:teavm-metaprogramming-impl:0.15.0'
}

// --- JAR Tasks ---

// The dependency jars bundled into the deployable: everything on the server
// runtime classpath except protoblast-client (zenit-common compiles against it,
// but a JVM fat jar must contain only protoblast-server's platform bytecode).
def serverFatJarDeps = {
    configurations.serverRuntimeClasspath.findAll {
        it.isFile() && !it.name.startsWith('protoblast-client-')
    }
}

// Every jar on the client (TeaVM) runtime classpath rides the browser fat jar.
def clientFatJarDeps = {
    configurations.clientRuntimeClasspath.findAll { it.isFile() }
}

// Resources with more than one legitimate copy across the classpath get ONE
// deliberately merged copy in the fat jar; every raw copy spec excludes them.
def mergedResourcePatterns = [
        'META-INF/services/**',
        'META-INF/microcopy/**',
        'META-INF/hawkeye/*.tsv',
]

// The browser jar additionally line-merges META-INF/teavm.properties:
// protoblast-client AND hawkeye-client each declare their own
// mapPackageHierarchy lines there, and a jar can only serve ONE copy per path.
def browserMergedResourcePatterns = mergedResourcePatterns + ['META-INF/teavm.properties']

// Packaging metadata that legitimately repeats across dependency jars but is
// meaningless inside a fat jar. Everything NOT listed here or merged above
// collides loudly (DuplicatesStrategy.FAIL below) instead of silently winning.
def inertMetadataPatterns = [
        'module-info.class',
        'META-INF/versions/*/module-info.class',
        'META-INF/MANIFEST.MF',
        'META-INF/INDEX.LIST',
        'META-INF/*LICENSE*',
        'META-INF/*NOTICE*',
        'META-INF/DEPENDENCIES',
        'META-INF/maven/**',
        'META-INF/proguard/**',
        'META-INF/native-image/**',
        'META-INF/versions/*/OSGI-INF/**',
        'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
        // Gradle incremental-compile state leaked into some published jars
        // (hawkeye-server/zenit-server pack compile-task OUTPUTS, which include
        // build/tmp/compileServerJava/previous-compilation-data.bin at jar root).
        'previous-compilation-data.bin',
]

task mergeServerServiceFiles(type: be.elevenways.protoblast.gradle.MergeServiceFilesTask) {
    serviceClasspath.from(sourceSets.server.output, files(serverFatJarDeps))
    outputDirectory = layout.buildDirectory.dir('merged-server-service-files')
}

task mergeServerResources(type: be.elevenways.protoblast.gradle.MergeResourceFilesTask) {
    resourceClasspath.from(sourceSets.server.output, files(serverFatJarDeps))
    lineMergedPatterns = ['META-INF/microcopy/keys.txt', 'META-INF/hawkeye/*.tsv']
    jsonMapMergedPatterns = ['META-INF/microcopy/*.json']
    outputDirectory = layout.buildDirectory.dir('merged-server-resources')
}

task serverJar(type: ShadowJar) {
    archiveClassifier = 'server'
    // AIDEV-NOTE: every entry path exists exactly ONCE in this jar. Mergeable
    // resources (services, microcopy catalogs/manifest, hawkeye tsv indexes) are
    // excluded from the raw specs and re-added as the merge tasks' deliberate
    // union -- Shadow's mergeServiceFiles() cannot do this (it ignores zipTree
    // copy specs) and the previous INCLUDE strategy kept 34 duplicate paths (32
    // byte-divergent, incl. 8 org/teavm JSO classes) resolved purely by entry
    // order. DuplicatesStrategy.FAIL makes any unhandled collision a build
    // error instead of an ordering accident.
    // AIDEV-NOTE: only the SERVER source set's BlastAutoLoadInit (the complete
    // server-side union) may survive; a dependency's partial loader would
    // silently shadow it and no models/settings register at boot. Deps are
    // bundled via zipTree so the per-source exclude can reach into them.
    def autoLoadInit = 'be/elevenways/protoblast/generated/BlastAutoLoadInit.class'
    from(sourceSets.server.output) {
        exclude mergedResourcePatterns + inertMetadataPatterns
    }
    from({
        // Protoblast's patched org/teavm classes (the sanctioned patch-shadow
        // lane) must win EXPLICITLY: strip the upstream copy of every patched
        // path from non-carrier jars instead of relying on copy order.
        def deps = serverFatJarDeps()
        def patched = be.elevenways.protoblast.gradle.TeaVmPatchLane.patchedEntries(deps)
        deps.collect { dep ->
            def tree = zipTree(dep)
            if (!be.elevenways.protoblast.gradle.TeaVmPatchLane.isPatchCarrier(dep) && !patched.isEmpty()) {
                tree = tree.matching { patched.each { p -> exclude p } }
            }
            tree
        }
    }) {
        exclude autoLoadInit
        exclude mergedResourcePatterns + inertMetadataPatterns
    }
    from({ project.configurations.spamserviceDistribution.singleFile }) {
        into 'managed-services'
        rename { 'spamservice-server.jar' }
    }
    from(tasks.named('mergeServerServiceFiles'))
    from(tasks.named('mergeServerResources'))
    duplicatesStrategy = DuplicatesStrategy.FAIL

    manifest {
        attributes(
            'Main-Class': 'be.elevenways.hohenheim.server.ServerMain',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            // dnsjava's Java 18 InetAddressResolverProvider exists only in META-INF/versions/18.
            'Multi-Release': 'true'
        )
    }

    doLast {
        def jarFile = archiveFile.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            // Whole-jar integrity: zero duplicate entry paths (the pre-fix jar
            // carried 34 duplicate paths, 32 with divergent bytes, resolved by
            // entry order alone).
            def entryNames = []
            jar.entries().each { entry ->
                if (!entry.isDirectory()) {
                    entryNames << entry.name
                }
            }
            def duplicates = entryNames.countBy { it }.findAll { name, count -> count > 1 }
            if (!duplicates.isEmpty()) {
                throw new GradleException("${jarFile.name} contains duplicate entry paths: ${duplicates}")
            }
            // The merged microcopy catalog must carry entries from MORE than one
            // module: a hohenheim-only key AND a zenit-cms-only one (a first-wins
            // duplicate strategy silently drops every dependency catalog).
            def enJson = new String(jar.getInputStream(jar.getJarEntry('META-INF/microcopy/en.json')).readAllBytes(), 'UTF-8')
            ['dyndns_token': 'hohenheim', 'back_to_list': 'zenit-cms'].each { key, module ->
                if (!enJson.contains("\"${key}\"")) {
                    throw new GradleException(
                        "Merged META-INF/microcopy/en.json lost the ${module} module's catalog (no '${key}')")
                }
            }
            def keysTxt = new String(jar.getInputStream(jar.getJarEntry('META-INF/microcopy/keys.txt')).readAllBytes(), 'UTF-8').readLines()
            ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'].each { key, module ->
                if (!keysTxt.contains(key)) {
                    throw new GradleException(
                        "Merged META-INF/microcopy/keys.txt lost the ${module} module's keys (no '${key}')")
                }
            }
            def multiRelease = jar.manifest?.mainAttributes?.getValue('Multi-Release')
            if (!'true'.equalsIgnoreCase(multiRelease)) {
                throw new GradleException("${jarFile.name} is missing Multi-Release: true")
            }
            def resolver = 'META-INF/versions/18/org/xbill/DNS/spi/DnsjavaInetAddressResolverProvider.class'
            if (jar.getEntry(resolver) == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's Java 18 resolver provider")
            }
            if (jar.getEntry('META-INF/services/java.net.spi.InetAddressResolverProvider') == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's resolver service registration")
            }
            def nested = jar.getJarEntry('managed-services/spamservice-server.jar')
            if (nested == null) {
                throw new GradleException("${jarFile.name} is missing the nested Spamservice distribution")
            }
            if (jar.getEntry('be/elevenways/spamservice/server/ServerMain.class') != null) {
                throw new GradleException("${jarFile.name} exploded Spamservice server classes onto Hohenheim's classpath")
            }
            def platformClass = 'be/elevenways/protoblast/common/dry/BlastDrySerializers.class'
            def platformCopies = jar.stream().filter { it.name == platformClass }.count()
            if (platformCopies != 1) {
                throw new GradleException("${jarFile.name} contains ${platformCopies} Protoblast platform copies")
            }
            def hashStream = { input ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
                digest.digest()
            }
            def expected = project.configurations.spamserviceDistribution.singleFile.withInputStream {
                hashStream(it)
            }
            def actual = jar.getInputStream(nested).withCloseable { hashStream(it) }
            if (!java.util.Arrays.equals(expected, actual)) {
                throw new GradleException("${jarFile.name} contains the wrong Spamservice distribution")
            }
        } finally {
            jar.close()
        }
    }
}

// --- TeaVM ---
task mergeBrowserServiceFiles(type: be.elevenways.protoblast.gradle.MergeServiceFilesTask) {
    serviceClasspath.from(sourceSets.client.output, configurations.clientRuntimeClasspath)
    outputDirectory = layout.buildDirectory.dir('merged-browser-service-files')
}

task mergeBrowserResources(type: be.elevenways.protoblast.gradle.MergeResourceFilesTask) {
    resourceClasspath.from(sourceSets.client.output, configurations.clientRuntimeClasspath)
    lineMergedPatterns = ['META-INF/microcopy/keys.txt', 'META-INF/hawkeye/*.tsv', 'META-INF/teavm.properties']
    jsonMapMergedPatterns = ['META-INF/microcopy/*.json']
    outputDirectory = layout.buildDirectory.dir('merged-browser-resources')
}

task browserJar(type: ShadowJar) {
    description = 'Fat JAR for TeaVM compilation'
    archiveClassifier = 'browser'
    // AIDEV-NOTE: every source set AND every dependency jar ships its own
    // be.elevenways.protoblast.generated.BlastAutoLoadInit at the SAME FQN, but each is the
    // @*AutoLoad union of ITS OWN classpath (partial/empty bodies). TeaVM can resolve only ONE
    // class per FQN; if an incomplete one wins, @*AutoLoad <clinit> registrations (settings,
    // custom-element registrations, DRY revivers) silently drop and hydration breaks. The COMPLETE
    // client-side union lives in the leaf 'client' source set (it holds the TeaVM mainClass
    // ClientMain and its compile classpath covers common + all client deps), so keep ONLY its
    // loader and exclude it from every other source set and from every dependency jar. Deps are
    // bundled via zipTree(...) so the per-source 'exclude' can reach into them.
    // AIDEV-NOTE: every entry path exists exactly ONCE in this jar. The
    // META-INF/services/...Template files come from mergeBrowserServiceFiles
    // (Shadow's mergeServiceFiles() ignores zipTree copy specs -- without the
    // merged union the dependency-jar template entries vanish and client-side
    // rendering throws "Unknown custom element"); microcopy manifests, hawkeye
    // tsv indexes and teavm.properties come merged from mergeBrowserResources.
    // Protoblast's PATCHED org/teavm JSO classes must win over upstream
    // teavm-jso-apis EXPLICITLY (the pre-fix INCLUDE jar carried both copies
    // and TeaVM's pick was decided by entry order); the upstream copy of every
    // patched path is stripped, and DuplicatesStrategy.FAIL turns any other
    // collision into a build error.
    def autoLoadInit = 'be/elevenways/protoblast/generated/BlastAutoLoadInit.class'
    from(sourceSets.client.output) {
        exclude browserMergedResourcePatterns + inertMetadataPatterns
    }
    from({
        def deps = clientFatJarDeps()
        def patched = be.elevenways.protoblast.gradle.TeaVmPatchLane.patchedEntries(deps)
        deps.collect { dep ->
            def tree = zipTree(dep)
            if (!be.elevenways.protoblast.gradle.TeaVmPatchLane.isPatchCarrier(dep) && !patched.isEmpty()) {
                tree = tree.matching { patched.each { p -> exclude p } }
            }
            tree
        }
    }) {
        exclude autoLoadInit
        exclude browserMergedResourcePatterns + inertMetadataPatterns
    }
    from(tasks.named('mergeBrowserServiceFiles'))
    from(tasks.named('mergeBrowserResources'))
    duplicatesStrategy = DuplicatesStrategy.FAIL

    doLast {
        def jarFile = archiveFile.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            // Zero duplicate entry paths (the pre-fix jar carried 15 duplicate
            // paths, all byte-divergent, resolved by entry order alone).
            def entryNames = []
            jar.entries().each { entry ->
                if (!entry.isDirectory()) {
                    entryNames << entry.name
                }
            }
            def duplicates = entryNames.countBy { it }.findAll { name, count -> count > 1 }
            if (!duplicates.isEmpty()) {
                throw new GradleException("${jarFile.name} contains duplicate entry paths: ${duplicates}")
            }
            // The surviving copy of every patched org/teavm path must be the
            // patch CARRIER's bytes: TeaVM compiling against the unpatched JSO
            // classes is exactly the silent failure this jar existed to avoid.
            def deps = clientFatJarDeps()
            def carriers = deps.findAll { be.elevenways.protoblast.gradle.TeaVmPatchLane.isPatchCarrier(it) }
            if (carriers.size() != 1) {
                throw new GradleException("Expected exactly one TeaVM patch carrier on the client classpath, found: ${carriers}")
            }
            def patched = be.elevenways.protoblast.gradle.TeaVmPatchLane.patchedEntries(carriers)
            new java.util.zip.ZipFile(carriers[0]).withCloseable { carrierZip ->
                patched.each { path ->
                    def jarEntry = jar.getJarEntry(path)
                    if (jarEntry == null) {
                        throw new GradleException("${jarFile.name} is missing patched class ${path}")
                    }
                    def jarBytes = jar.getInputStream(jarEntry).readAllBytes()
                    def carrierBytes = carrierZip.getInputStream(carrierZip.getEntry(path)).readAllBytes()
                    if (!java.util.Arrays.equals(jarBytes, carrierBytes)) {
                        throw new GradleException("${jarFile.name} carries an UNPATCHED copy of ${path} (upstream bytes won over the patch carrier)")
                    }
                }
            }
            // The merged microcopy key manifest must carry keys from MORE than
            // one module (thoth's failure mode: first-wins dropped every
            // dependency module's copy).
            def keysTxt = new String(jar.getInputStream(jar.getJarEntry('META-INF/microcopy/keys.txt')).readAllBytes(), 'UTF-8').readLines()
            ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'].each { key, module ->
                if (!keysTxt.contains(key)) {
                    throw new GradleException(
                        "Merged META-INF/microcopy/keys.txt lost the ${module} module's keys (no '${key}')")
                }
            }
        } finally {
            jar.close()
        }
    }
}

tasks.withType(GenerateJavaScriptTask).configureEach {
    dependsOn browserJar
    classpath.setFrom(files(browserJar.archiveFile) + configurations.teavmLibs)
}

teavm {
    js {
        obfuscated = false
        addedToWebApp = true
        sourceMap = true
        strict = false
        sourceFilePolicy = SourceFilePolicy.LINK_LOCAL_FILES
        optimization = OptimizationLevel.NONE
        mainClass = "be.elevenways.hohenheim.ClientMain"
        // The shell auto-injects the bundle from Hawkeye.clientScriptLocation;
        // ServerMain points that at /cms.js, so the bundle lands there.
        targetFileName = "cms.js"
    }
}

// The protoblast plugin's Hawkeye template stage registers copyClientJs (copies
// TeaVM JS + source map into public/) and compileHawkeyeScss (generates
// public/hohenheim.css from src/common/scss/app.scss + extracted .hwk tag
// styles; the browserTest dependency is wired automatically).
afterEvaluate {
    serverJar.dependsOn 'copyClientJs', 'compileHawkeyeScss'
}

// --- Browser Test Task ---
task browserTest(type: Test) {
    description = 'Run browser tests using Playwright'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // AIDEV-NOTE: two buckets. Shared-server classes (@Tag("shared-server"), inherited
    // from HohenheimTestBase) share one booted server per JVM across parallel forks --
    // forkEvery = 1 here was skeleton cargo cult that cost a JVM + full server boot per
    // class (the whole 18-minute suite). Standalone classes re-point the GLOBAL
    // Database.PATH and re-init the runtime for themselves, which yanks the database out
    // from under a live shared server, so they stay isolated in browserTestIsolated.
    useJUnitPlatform {
        includeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = Math.min(Math.max(Runtime.runtime.availableProcessors().intdiv(2) - 1, 1), 4)
    timeout = java.time.Duration.ofMinutes(30)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// Standalone browser-test classes (no shared server): each re-initializes global
// runtime state for itself, so every class gets a fresh JVM, exactly as before.
task browserTestIsolated(type: Test) {
    description = 'Run standalone browser tests needing per-class JVM isolation'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    useJUnitPlatform {
        excludeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = Math.min(Math.max(Runtime.runtime.availableProcessors().intdiv(2) - 1, 1), 4)
    forkEvery = 1
    timeout = java.time.Duration.ofMinutes(30)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// --- Task Dependencies ---
afterEvaluate {
    tasks.named('compileServerJava') {
        dependsOn 'compileCommonJava'
    }
    tasks.named('generateJavaScript') {
        dependsOn 'compileClientJava', 'compileCommonJava'
    }
    tasks.named('compileBrowserTestJava') {
        dependsOn 'compileCommonJava', 'compileServerJava', 'compileClientJava'
    }
}

// --- Clean ---
tasks.named('clean') {
    doFirst {
        delete(layout.buildDirectory.dir('generated-sources/hawkeye'))
        delete(layout.buildDirectory.dir('generated/teavm'))
        delete('public/cms.js')
        delete('public/hohenheim.css')
    }
}
