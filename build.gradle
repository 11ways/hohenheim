import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.teavm.gradle.api.OptimizationLevel
import org.teavm.gradle.api.SourceFilePolicy
import org.teavm.gradle.tasks.GenerateJavaScriptTask

plugins {
    id 'java-library'
    id 'org.teavm' version '0.15.0'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'be.elevenways.protoblast' version '0.1.0-SNAPSHOT'
    id 'be.elevenways.zenit' version '0.1.0-SNAPSHOT'
}

// AIDEV-NOTE: the org.checkerframework Gradle plugin was removed during the Java 25 / Gradle 9
// migration (it dropped checker-qual from custom source sets and ran no checkers anyway); the
// checker-qual annotation artifact is declared directly on every source set below instead.

group = 'be.elevenways'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// --- Source Sets ---
sourceSets {
    common {
        java { srcDirs = ['src/common/java'] }
        resources { srcDirs = ['src/common/resources'] }
    }

    client {
        java {
            srcDirs = ['src/client/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/client/resources'] }
    }

    server {
        java {
            srcDirs = ['src/server/java']
            compileClasspath += sourceSets.common.output
        }
        resources { srcDirs = ['src/server/resources'] }
    }

    browserTest {
        java { srcDirs = ['src/browserTest/java'] }
        resources { srcDirs = ['src/browserTest/resources'] }
        // Server fold: server.output carries the server fold of every common class.
        // build/classes/java/common is the CHIMERA fold (common compiles against
        // protoblast-client, so IS_TEAVM folds to the BROWSER value) -- never stack it.
        compileClasspath += sourceSets.server.output + sourceSets.client.output
        runtimeClasspath += sourceSets.server.output
    }
}

// --- Hawkeye Template Compilation ---
hawkeye {
    namespace = 'hohenheim'
    templateDirs = ['src/common/templates']
    scss {
        // Registers /hohenheim.css at the app weight (registration class is
        // generated by the be.elevenways.zenit plugin).
        register = 'app'
    }
}

// --- Configurations ---
configurations {
    all {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }

    spamserviceDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// --- Compile Tasks ---
tasks.named('compileCommonJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileServerJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}
tasks.named('compileClientJava') {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// --- Dependencies ---
dependencies {
    // Common (compile-only since client/server each pull their own variant)
    commonCompileOnly teavm.libs.jsoApis
    commonCompileOnly ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:plumage-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-forms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-microcopy-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-auth-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-cms-common:0.1.0-SNAPSHOT') { changing = true }
    commonCompileOnly ('be.elevenways:zenit-widget-common:0.1.0-SNAPSHOT') { changing = true }

    // Client (TeaVM-compiled browser code)
    clientCompileOnly sourceSets.common.output
    clientImplementation teavm.libs.jsoApis
    clientImplementation ('be.elevenways:protoblast-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:hawkeye-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:plumage-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-forms-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-microcopy-client:0.1.0-SNAPSHOT') { changing = true }
    clientImplementation ('be.elevenways:zenit-cms-client:0.1.0-SNAPSHOT') { changing = true }
    // The shell user menu (zn-auth-user-menu, contributed by AuthCmsBridge)
    // must hydrate: the client bundle needs zenit-auth's compiled templates
    // (carried by the self-sufficient client platform jar).
    clientImplementation ('be.elevenways:zenit-auth-client:0.1.0-SNAPSHOT') { changing = true }

    // Server
    serverCompileOnly sourceSets.common.output
    serverImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    serverImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    // Spamservice: the canonical IP-reputation / security-event authority
    // (reputation pulls + client provisioning for managed sites).
    serverImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    spamserviceDistribution ('be.elevenways:spamservice-server:0.1.0-SNAPSHOT') { changing = true }

    commonImplementation 'org.checkerframework:checker-qual:4.2.0'
    clientImplementation 'org.checkerframework:checker-qual:4.2.0'
    serverImplementation 'org.checkerframework:checker-qual:4.2.0'

    // Database
    serverImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // ACME / Let's Encrypt
    serverImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'

    // DNS wire format (authoritative DNS server)
    serverImplementation 'dnsjava:dnsjava:3.6.5'

    // PEM parsing (BouncyCastle)
    serverImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // Browser tests
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer auto-provides the JUnit Platform launcher (propagates to browserTest
    // via extendsFrom). Java 25 needs checker-qual on the test classpaths too (the removed
    // checkerframework plugin used to supply it).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.checkerframework:checker-qual:4.2.0'
    browserTestImplementation platform('org.junit:junit-bom:5.10.0')
    browserTestImplementation 'org.junit.jupiter:junit-jupiter'
    browserTestImplementation 'com.microsoft.playwright:playwright:1.48.0'
    browserTestImplementation 'org.assertj:assertj-core:3.25.3'
    browserTestImplementation sourceSets.server.output
    browserTestImplementation ('be.elevenways:protoblast-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-auth-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:hawkeye-test-support:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:plumage-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-forms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-microcopy-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:spamservice-client:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-cms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation ('be.elevenways:zenit-comms-server:0.1.0-SNAPSHOT') { changing = true }
    browserTestImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    browserTestImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    browserTestImplementation 'org.shredzone.acme4j:acme4j-client:3.4.0'
    browserTestImplementation 'dnsjava:dnsjava:3.6.5'
}

// --- JAR Tasks ---
// The whole assembly doctrine (merged services/resources/microcopy/tsv/
// teavm.properties, the TeaVmPatchLane strip, DuplicatesStrategy.FAIL, the
// zero-duplicate and patched-byte checks, inert-metadata exclusion) comes from
// the protoblast plugin's blastServerJar/blastTeavmJar lanes; only hohenheim's
// own content and assertions live here.
def serverJar = blastServerJar(
        mainClass: 'be.elevenways.hohenheim.server.ServerMain',
        // dnsjava's Java 18 InetAddressResolverProvider exists only in META-INF/versions/18.
        multiRelease: true,
        implementationTitle: project.name,
        microcopyKeys: ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'],
        microcopyScopes: ['dyndns_token': 'hohenheim', 'back_to_list': 'zenit-cms'],
)

serverJar.configure {
    from({ project.configurations.spamserviceDistribution.singleFile }) {
        into 'managed-services'
        rename { 'spamservice-server.jar' }
    }

    // App-specific integrity checks (deliberately NOT generalized into the lane).
    doLast {
        def jarFile = archiveFile.get().asFile
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            def resolver = 'META-INF/versions/18/org/xbill/DNS/spi/DnsjavaInetAddressResolverProvider.class'
            if (jar.getEntry(resolver) == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's Java 18 resolver provider")
            }
            if (jar.getEntry('META-INF/services/java.net.spi.InetAddressResolverProvider') == null) {
                throw new GradleException("${jarFile.name} is missing dnsjava's resolver service registration")
            }
            def nested = jar.getJarEntry('managed-services/spamservice-server.jar')
            if (nested == null) {
                throw new GradleException("${jarFile.name} is missing the nested Spamservice distribution")
            }
            if (jar.getEntry('be/elevenways/spamservice/server/ServerMain.class') != null) {
                throw new GradleException("${jarFile.name} exploded Spamservice server classes onto Hohenheim's classpath")
            }
            def platformClass = 'be/elevenways/protoblast/common/dry/BlastDrySerializers.class'
            def platformCopies = jar.stream().filter { it.name == platformClass }.count()
            if (platformCopies != 1) {
                throw new GradleException("${jarFile.name} contains ${platformCopies} Protoblast platform copies")
            }
            def hashStream = { input ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
                digest.digest()
            }
            def expected = project.configurations.spamserviceDistribution.singleFile.withInputStream {
                hashStream(it)
            }
            def actual = jar.getInputStream(nested).withCloseable { hashStream(it) }
            if (!java.util.Arrays.equals(expected, actual)) {
                throw new GradleException("${jarFile.name} contains the wrong Spamservice distribution")
            }
        } finally {
            jar.close()
        }
    }
}

// --- TeaVM ---
// The lane also owns the teavmInput configuration (jar + TeaVM runtime libs)
// and the GenerateJavaScriptTask wiring.
blastTeavmJar(
        taskName: 'browserJar',
        description: 'Fat JAR for TeaVM compilation',
        microcopyKeys: ['add_domain': 'hohenheim', 'back_to_list': 'zenit-cms'],
)

teavm {
    js {
        obfuscated = false
        addedToWebApp = true
        sourceMap = true
        strict = false
        sourceFilePolicy = SourceFilePolicy.LINK_LOCAL_FILES
        optimization = OptimizationLevel.NONE
        mainClass = "be.elevenways.hohenheim.ClientMain"
        // The shell auto-injects the bundle from Hawkeye.clientScriptLocation;
        // ServerMain points that at /cms.js, so the bundle lands there.
        targetFileName = "cms.js"
    }
}

// The protoblast plugin's Hawkeye template stage registers copyClientJs (copies
// TeaVM JS + source map into public/) and compileHawkeyeScss (generates
// public/hohenheim.css from src/common/scss/app.scss + extracted .hwk tag
// styles; the browserTest dependency is wired automatically).
afterEvaluate {
    serverJar.configure { dependsOn 'copyClientJs', 'compileHawkeyeScss' }
}

// --- Browser Test Task ---
task browserTest(type: Test) {
    description = 'Run browser tests using Playwright'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    // AIDEV-NOTE: two buckets. Shared-server classes (@Tag("shared-server"), inherited
    // from HohenheimTestBase) share one booted server per JVM across parallel forks --
    // forkEvery = 1 here was skeleton cargo cult that cost a JVM + full server boot per
    // class (the whole 18-minute suite). Standalone classes re-point the GLOBAL
    // Database.PATH and re-init the runtime for themselves, which yanks the database out
    // from under a live shared server, so they stay isolated in browserTestIsolated.
    useJUnitPlatform {
        includeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = Math.min(Math.max(Runtime.runtime.availableProcessors().intdiv(2) - 1, 1), 4)
    // Gradle's Test default is 512m; the build lane buffers an image tar through heap
    // (bounded by builds.max_artifact_mb), so a realistic artifact needs real headroom.
    maxHeapSize = '2g'
    timeout = java.time.Duration.ofMinutes(30)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// Standalone browser-test classes (no shared server): each re-initializes global
// runtime state for itself, so every class gets a fresh JVM, exactly as before.
task browserTestIsolated(type: Test) {
    description = 'Run standalone browser tests needing per-class JVM isolation'
    group = 'verification'
    dependsOn 'copyClientJs'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    useJUnitPlatform {
        excludeTags 'shared-server'
    }
    filter.failOnNoMatchingTests = false
    maxParallelForks = Math.min(Math.max(Runtime.runtime.availableProcessors().intdiv(2) - 1, 1), 4)
    // See browserTest: the buffered artifact read outgrows Gradle's 512m default.
    maxHeapSize = '2g'
    forkEvery = 1
    timeout = java.time.Duration.ofMinutes(30)

    systemProperty 'playwright.headless', System.getProperty('playwright.headless', 'true')

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
    }
}

// --- Task Dependencies ---
afterEvaluate {
    tasks.named('compileServerJava') {
        dependsOn 'compileCommonJava'
    }
    tasks.named('generateJavaScript') {
        dependsOn 'compileClientJava', 'compileCommonJava'
    }
    tasks.named('compileBrowserTestJava') {
        dependsOn 'compileCommonJava', 'compileServerJava', 'compileClientJava'
    }
}

// --- Clean ---
tasks.named('clean') {
    doFirst {
        delete(layout.buildDirectory.dir('generated-sources/hawkeye'))
        delete(layout.buildDirectory.dir('generated/teavm'))
        delete('public/cms.js')
        delete('public/hohenheim.css')
    }
}
